name: Test language bindings

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go C ABI binding (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test standalone Go module
        working-directory: lib/bindings/go
        run: GOWORK=off go test -race ./...

  php:
    name: PHP FFI binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi
          tools: composer:v2
      - run: composer --working-dir=lib/bindings/php validate --no-check-publish
      - run: composer --working-dir=lib/bindings/php test

  python:
    name: Python ctypes binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q lib/bindings/python/src
      - run: bash lib/bindings/python/tests/run.sh

  node:
    name: Node N-API binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm --prefix lib/bindings/node test

  ruby:
    name: Ruby Fiddle binding (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Test standalone Ruby gem
        working-directory: lib/bindings/ruby
        run: ruby -Ilib -e 'Dir["test/test_*.rb"].sort.each { |file| require File.expand_path(file) }'

  rust:
    name: Rust dynamic binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path lib/bindings/rust/Cargo.toml

  package-preview:
    name: Package release candidates
    needs: [go, php, python, node, ruby, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest scripts/test_stage_language_bindings.py
      - run: python3 -m pip install build
      - name: Stage and package all six bindings
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kvlite-cargo-target
        run: |
          python3 scripts/stage-language-bindings.py v0.1.0 "$RUNNER_TEMP/kvlite-bindings" --pypi-name usekvlite
          bash scripts/package-language-bindings.sh "$RUNNER_TEMP/kvlite-bindings" "$RUNNER_TEMP/kvlite-distributions"
