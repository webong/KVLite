name: Build release artifacts

on:
  push:
    tags:
      - 'v*'
      - '!v*-canary.*'
  workflow_dispatch:
    inputs:
      publish_canary:
        description: Publish a prerelease from main after all artifacts pass
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  ROCKSDB_VERSION: v10.8.3
  NEXT_RELEASE_VERSION: 0.1.0

jobs:
  prepare:
    name: Select release channel and immutable version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - id: version
        shell: bash
        env:
          PUBLISH_CANARY: ${{ inputs.publish_canary }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Stable releases require a vX.Y.Z tag" >&2
              exit 1
            fi
            version="$GITHUB_REF_NAME"
            channel=stable
          elif [[ "$PUBLISH_CANARY" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REPOSITORY" != "webong/KVlite" ]]; then
              echo "Canaries may only publish from webong/KVlite main" >&2
              exit 1
            fi
            if (( GITHUB_RUN_ATTEMPT > 99 )); then
              echo "Canary run attempt exceeds the version sequence range" >&2
              exit 1
            fi
            sequence=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
            version="v${NEXT_RELEASE_VERSION}-canary.${sequence}"
            channel=canary
          else
            version="dev-${GITHUB_SHA:0:12}"
            channel=build
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  native-artifacts:
    name: ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          # macos-13 (the last Intel label before it) was retired by GitHub
          # in December 2025; macos-15-intel is the final Intel macOS
          # runner (itself retired August 2027). Revisit then.
          - os: macos-15-intel
            target: darwin-amd64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install RocksDB build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            ca-certificates \
            git \
            libbz2-dev \
            liblz4-dev \
            libsnappy-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Install RocksDB build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bzip2 lz4 snappy zstd

      - name: Build pinned RocksDB
        shell: bash
        run: |
          rocksdb_source="${RUNNER_TEMP}/rocksdb-source"
          rocksdb_prefix="${RUNNER_TEMP}/rocksdb"
          git clone --depth 1 --branch "${ROCKSDB_VERSION}" \
            https://github.com/facebook/rocksdb.git "${rocksdb_source}"

          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            homebrew_prefix="$(brew --prefix)"
            export CPPFLAGS="-I${homebrew_prefix}/include"
            export LDFLAGS="-L${homebrew_prefix}/lib"
            # RocksDB's feature probes compile with CFLAGS/CXXFLAGS only;
            # CPPFLAGS alone leaves compression headers invisible and the
            # build silently drops them (surfacing much later as
            # "Compression type ... is not linked with the binary").
            export CFLAGS="-I${homebrew_prefix}/include"
            export CXXFLAGS="-I${homebrew_prefix}/include"
          fi

          if command -v nproc >/dev/null 2>&1; then
            jobs="$(nproc)"
          else
            jobs="$(sysctl -n hw.ncpu)"
          fi
          (
            cd "${rocksdb_source}"
            make -j"${jobs}" DISABLE_WARNING_AS_ERROR=1 shared_lib
          )

          mkdir -p "${rocksdb_prefix}/include" "${rocksdb_prefix}/lib"
          cp -R "${rocksdb_source}/include/rocksdb" "${rocksdb_prefix}/include/"
          cp "${rocksdb_source}"/librocksdb.* "${rocksdb_prefix}/lib/"
          # KVLite's default profile compresses with LZ4: fail the build
          # here if the feature probe missed it instead of failing tests
          # ten minutes later.
          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            otool -L "${rocksdb_prefix}"/lib/librocksdb.*.dylib | grep -qi lz4 \
              || { echo 'RocksDB was built without LZ4 support' >&2; exit 1; }
          else
            ldd "${rocksdb_prefix}"/lib/librocksdb.so* | grep -qi lz4 \
              || { echo 'RocksDB was built without LZ4 support' >&2; exit 1; }
          fi
          echo "KVLITE_ROCKSDB_PREFIX=${rocksdb_prefix}" >> "${GITHUB_ENV}"

      - name: Build native artifacts
        shell: bash
        run: |
          export CGO_CFLAGS="-I${KVLITE_ROCKSDB_PREFIX}/include"
          export CGO_LDFLAGS="-L${KVLITE_ROCKSDB_PREFIX}/lib"
          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            homebrew_prefix="$(brew --prefix)"
            export CGO_CFLAGS="${CGO_CFLAGS} -I${homebrew_prefix}/include"
            export CGO_LDFLAGS="${CGO_LDFLAGS} -L${homebrew_prefix}/lib"
            export DYLD_LIBRARY_PATH="${KVLITE_ROCKSDB_PREFIX}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          else
            export LD_LIBRARY_PATH="${KVLITE_ROCKSDB_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          fi

          version="${{ needs.prepare.outputs.version }}"
          # Core first WITHOUT the RocksDB tags: its driver-loader tests dlopen
          # freshly built Go shared libraries, and a C++-linked (RocksDB)
          # host corrupts the loaded module's heap on Intel macOS
          # (deterministic bad-sweepgen fatal; ARM64/Linux tolerate it).
          # This mirrors product topology, where C++ lives inside driver
          # bundles and loading hosts stay lean.
          go test . ./src/... ./capi ./cmd/kvlite ./extensions/http/... ./extensions/redis/...
          go test -tags rocksdb ./capi ./cmd/kvlite ./extensions/rocksdb/... ./extensions/http/... ./extensions/redis/... ./examples/basic
          make release RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}" DRIVER=none
          make release RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}" DRIVER=rocksdb
          make release RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}" DRIVER=leveldb
          make release RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}" DRIVER=badgerdb
          make release RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}" DRIVER=boltdb
          make release RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}" DRIVER=lmdb
          make release-http RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}"
          make release-redis RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}"

      - name: Go binding through the host and installed LevelDB bundle
        if: matrix.target != 'darwin-amd64'
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          library_name=libkvlite.so
          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            library_name=libkvlite.dylib
          fi
          export KVLITE_HOME="$PWD/dist/$version/$target"
          export KVLITE_TEST_NATIVE_LIBRARY="$KVLITE_HOME/host/lib/$library_name"
          export KVLITE_TEST_NATIVE_DRIVER=leveldb
          GOWORK=off go test -run '^TestInstalledNativeLibrary$' -count=1 ./...

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Ruby binding against the packaged LevelDB library
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          library_name=libkvlite.so
          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            library_name=libkvlite.dylib
          fi
          export KVLITE_TEST_NATIVE_LIBRARY="$PWD/dist/$version/$target/drivers/leveldb/lib/$library_name"
          (cd lib/bindings/ruby && ruby -Ilib -e 'Dir["test/test_*.rb"].sort.each { |file| require File.expand_path(file) }')

      - name: Standalone extension integration (LevelDB)
        # Go hosts cannot load Go driver modules on Intel macOS (see
        # MODULES.md "Platform support"); builds and verification below
        # still cover that target.
        if: matrix.target != 'darwin-amd64'
        shell: bash
        run: make test-standalone-modules

      - name: Self-contained RocksDB runtime bundle
        shell: bash
        run: |
          notices="${RUNNER_TEMP}/runtime-notices"
          bash ./scripts/collect-runtime-notices.sh "${RUNNER_TEMP}/rocksdb-source" "${notices}"
          notice_args=()
          for notice in "${notices}"/*; do
            notice_args+=(--notice-file "$notice")
          done
          version="${{ needs.prepare.outputs.version }}"
          if [[ "${RUNNER_OS}" == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install --yes patchelf
            export LD_LIBRARY_PATH="${KVLITE_ROCKSDB_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          else
            export DYLD_LIBRARY_PATH="${KVLITE_ROCKSDB_PREFIX}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          fi
          export CGO_CFLAGS="-I${KVLITE_ROCKSDB_PREFIX}/include"
          export CGO_LDFLAGS="-L${KVLITE_ROCKSDB_PREFIX}/lib"
          # Bare dependency names (RocksDB records its install-name basename,
          # not a path) resolve through this link-time library directory.
          export KVLITE_BUNDLE_LIB_PATH="${KVLITE_ROCKSDB_PREFIX}/lib"
          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            # Mirror the library search paths of the build step above:
            # compression libraries live under the Homebrew prefix, and the
            # link needs them even though their headers were only needed to
            # compile.
            homebrew_prefix="$(brew --prefix)"
            export CGO_CFLAGS="${CGO_CFLAGS} -I${homebrew_prefix}/include"
            export CGO_LDFLAGS="${CGO_LDFLAGS} -L${homebrew_prefix}/lib"
          fi
          bash ./scripts/build-release.sh --version "$version" --target "${{ matrix.target }}" \
            --driver rocksdb --bundle-runtime "${notice_args[@]}"
          # The runtime bundle supersedes the plain RocksDB bundle above: same
          # CLI and C ABI plus bundled native dependencies and NOTICES.
          export KVLITE_HOME="$PWD/dist/$version/${{ matrix.target }}"
          ./dist/"$version"/"${{ matrix.target }}"/drivers/rocksdb/bin/kvlite module verify rocksdb

      - name: Standalone extension integration (RocksDB)
        # See above: no Go-module dynamic serving on Intel macOS.
        if: matrix.target != 'darwin-amd64'
        shell: bash
        run: |
          export CGO_CFLAGS="-I${KVLITE_ROCKSDB_PREFIX}/include"
          export CGO_LDFLAGS="-L${KVLITE_ROCKSDB_PREFIX}/lib"
          if [[ "${RUNNER_OS}" == 'macOS' ]]; then
            homebrew_prefix="$(brew --prefix)"
            export CGO_CFLAGS="${CGO_CFLAGS} -I${homebrew_prefix}/include"
            export CGO_LDFLAGS="${CGO_LDFLAGS} -L${homebrew_prefix}/lib"
            export DYLD_LIBRARY_PATH="${KVLITE_ROCKSDB_PREFIX}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          else
            export LD_LIBRARY_PATH="${KVLITE_ROCKSDB_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          fi
          KVLITE_STANDALONE_DRIVER=rocksdb \
          KVLITE_STANDALONE_TEST_VERSION=standalone-test-rocksdb \
            make test-standalone-modules

      - name: Pack release tarballs
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          make dist-tarballs RELEASE_VERSION="$version" RELEASE_TARGET="${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: kvlite-${{ matrix.target }}
          path: dist/*/${{ matrix.target }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kvlite-release-${{ matrix.target }}
          path: |
            dist/kvlite-*.tar.gz
            dist/kvlite-*.tar.gz.sha256
          if-no-files-found: error

  github-release:
    name: Publish verified GitHub Release
    needs: [prepare, native-artifacts, binding-packages]
    if: needs.prepare.outputs.channel != 'build' && github.repository == 'webong/KVlite'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kvlite-release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: binding-python
          path: release-assets/bindings/python
      - uses: actions/download-artifact@v4
        with:
          name: binding-node
          path: release-assets/bindings/node
      - uses: actions/download-artifact@v4
        with:
          name: binding-ruby
          path: release-assets/bindings/ruby
      - uses: actions/download-artifact@v4
        with:
          name: binding-rust
          path: release-assets/bindings/rust
      - name: Verify and publish all platform assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          shopt -s nullglob
          tarballs=(release-assets/kvlite-*.tar.gz)
          checksums=(release-assets/kvlite-*.tar.gz.sha256)
          if [[ ${#tarballs[@]} -ne 3 || ${#checksums[@]} -ne 3 ]]; then
            echo "Expected three platform tarballs and matching checksums" >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c ./*.tar.gz.sha256)
          packages=(release-assets/bindings/*/*)
          if [[ ${#packages[@]} -ne 5 ]]; then
            echo "Expected Python wheel/sdist, npm tarball, Ruby gem, and Rust crate" >&2
            exit 1
          fi
          if [[ $(grep -c '^version="latest"$' scripts/install-online.sh) -ne 1 ]]; then
            echo "Installer default-version marker missing" >&2
            exit 1
          fi
          sed "s/^version=\"latest\"$/version=\"$RELEASE_VERSION\"/" \
            scripts/install-online.sh > release-assets/kvlite-installer.sh
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          release_flags=(--title "KVLite $RELEASE_VERSION" --generate-notes)
          if [[ "$RELEASE_CHANNEL" == 'stable' ]]; then
            release_flags+=(--verify-tag)
          else
            release_flags+=(--prerelease --target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_VERSION" "${tarballs[@]}" "${checksums[@]}" "${packages[@]}" release-assets/kvlite-installer.sh "${release_flags[@]}"

  binding-packages:
    name: Build language packages
    needs: [prepare, native-artifacts]
    if: needs.prepare.outputs.channel != 'build' && github.repository == 'webong/KVlite'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi
          tools: composer:v2
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest scripts/test_stage_language_bindings.py
      - name: Test bindings from the release commit
        shell: bash
        run: |
          GOWORK=off go test -race ./...
          composer --working-dir=lib/bindings/php test
          bash lib/bindings/python/tests/run.sh
          npm --prefix lib/bindings/node test
          (cd lib/bindings/ruby && ruby -Ilib -e 'Dir["test/test_*.rb"].sort.each { |file| require File.expand_path(file) }')
          cargo test --manifest-path lib/bindings/rust/Cargo.toml
      - run: python3 -m pip install build
      - name: Stage and package release candidates
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kvlite-cargo-target
        run: |
          python3 scripts/stage-language-bindings.py "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/kvlite-bindings" --pypi-name usekvlite
          bash scripts/package-language-bindings.sh "$RUNNER_TEMP/kvlite-bindings" "$RUNNER_TEMP/kvlite-distributions"
      - uses: actions/upload-artifact@v4
        with:
          name: binding-go-source
          path: ${{ runner.temp }}/kvlite-bindings/go
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binding-python
          path: ${{ runner.temp }}/kvlite-distributions/python
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binding-node
          path: ${{ runner.temp }}/kvlite-distributions/node
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binding-ruby
          path: ${{ runner.temp }}/kvlite-distributions/ruby
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binding-rust-source
          path: ${{ runner.temp }}/kvlite-bindings/rust
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binding-rust
          path: ${{ runner.temp }}/kvlite-distributions/rust
          if-no-files-found: error

  publish-python:
    name: Publish usekvlite to PyPI
    needs: [prepare, binding-packages, github-release]
    if: vars.KVLITE_PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binding-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-node:
    name: Publish usekvlite to npm
    needs: [prepare, binding-packages, github-release]
    if: vars.KVLITE_PUBLISH_NPM == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binding-node
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global 'npm@^11.5.1'
      - name: Publish the validated tarball
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          shopt -s nullglob
          packages=(./dist/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one npm package" >&2
            exit 1
          fi
          publish_flags=(--access public)
          if [[ "$RELEASE_CHANNEL" == 'canary' ]]; then
            publish_flags+=(--tag canary)
          fi
          npm publish "${packages[0]}" "${publish_flags[@]}"

  publish-ruby:
    name: Publish kvlite to RubyGems
    needs: [prepare, binding-packages, github-release]
    if: vars.KVLITE_PUBLISH_RUBY == 'true'
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binding-ruby
          path: dist
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish the validated gem
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./dist/kvlite-*.gem)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one Ruby gem" >&2
            exit 1
          fi
          gem push "${packages[0]}" --host https://rubygems.org

  publish-rust:
    name: Publish usekvlite to crates.io
    needs: [prepare, binding-packages, github-release]
    if: vars.KVLITE_PUBLISH_CRATES == 'true'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binding-rust-source
          path: rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-php:
    name: Mirror PHP package for Packagist
    needs: [prepare, binding-packages, github-release]
    if: vars.KVLITE_PUBLISH_PHP == 'true'
    runs-on: ubuntu-24.04
    environment: packagist
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push PHP subtree without rewriting existing tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KVLITE_PHP_SPLIT_TOKEN }}
          PHP_SPLIT_REPO: ${{ vars.KVLITE_PHP_SPLIT_REPO }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ ! "$PHP_SPLIT_REPO" =~ ^webong/[A-Za-z0-9._-]+$ ]]; then
            echo "Set KVLITE_PHP_SPLIT_REPO to the dedicated webong PHP repository" >&2
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Set KVLITE_PHP_SPLIT_TOKEN with write access to that repository" >&2
            exit 1
          fi
          gh auth setup-git
          split_sha="$(git subtree split --prefix=lib/bindings/php HEAD)"
          git remote add php "https://github.com/$PHP_SPLIT_REPO.git"
          if [[ "$RELEASE_CHANNEL" == 'canary' ]]; then
            git push php "$split_sha:refs/heads/main"
          else
            git push --atomic php "$split_sha:refs/heads/main" "$split_sha:refs/tags/$RELEASE_VERSION"
          fi
