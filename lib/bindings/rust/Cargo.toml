[package]
name = "usekvlite"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.70"
description = "Embedded Rust client for KVLite's stable C ABI"
license = "MIT"
repository = "https://github.com/webong/KVLite"
homepage = "https://github.com/webong/KVLite"
readme = "README.md"
keywords = ["kvlite", "rocksdb", "key-value", "embedded"]
categories = ["database"]

[lib]
name = "kvlite"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
